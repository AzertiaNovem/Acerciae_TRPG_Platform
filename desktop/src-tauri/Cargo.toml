[package]
name = "acerciae-desktop"
version = "0.1.0"
description = "Acerciae TRPG desktop client"
authors = ["AzertiaFlores"]
license = "BSD-3-Clause"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "acerciae_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
tokio = { version = "1", features = ["fs", "io-util", "process", "macros", "rt-multi-thread"] }
futures-util = "0.3"
percent-encoding = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
