services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acerciae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acerciae}
      POSTGRES_DB: ${POSTGRES_DB:-acerciae}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acerciae} -d ${POSTGRES_DB:-acerciae}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # Reachable from this machine only (psql, backups); the backend uses the compose network.
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://acerciae:acerciae@db:5432/acerciae}
      HTTP_PORT: 8080
      UPLOAD_DIR: /data/uploads
      PDF_WORKER_TOKEN: ${PDF_WORKER_TOKEN:?Set PDF_WORKER_TOKEN to a random secret of at least 32 characters}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to a random secret of at least 32 characters (openssl rand -hex 32)}
      # The bundled frontend's nginx sets X-Real-IP; the backend port below is bound to this machine only.
      TRUST_PROXY: ${TRUST_PROXY:-true}
    restart: unless-stopped
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "5173:80"

  pdf-worker:
    build: ./pdf-worker
    environment:
      API_BASE: http://backend:8080
      PDF_WORKER_TOKEN: ${PDF_WORKER_TOKEN:?Set PDF_WORKER_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,size=512m
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [s3]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-acerciae}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-development-change-me}
    volumes:
      - objects:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

volumes:
  pgdata:
  uploads:
  objects:
