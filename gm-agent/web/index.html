<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GM 控制台</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><small>ACERCIAE</small><h1>GM 控制台</h1></div><form id="login"><label for="token">访问令牌</label><input id="token" type="password" autocomplete="off" required><button>连接</button></form></header>
<main><aside><h2>主持频道</h2><p>各频道独立运行，共享 LLM 连接。</p><div id="channels"></div></aside><section><div class="toolbar"><h2 id="title">选择频道</h2><div><button data-action="start">启动</button><button data-action="stop">停止</button><button data-action="restart">重启</button></div></div><p>修改当前频道的节奏、模式、模型及上下文配置。保存后仅重启正在运行的当前频道；停止的频道保持停止。</p><label for="yaml">频道配置 · YAML</label><textarea id="yaml" spellcheck="false" disabled></textarea><div class="toolbar"><button id="save" disabled>保存并应用</button><button id="reload" disabled>重新载入</button></div><p id="notice" role="status" aria-live="polite">输入公共配置中的 Web UI 访问令牌。</p></section></main><script src="/app.js"></script></body></html>
