name: Acerciae
options:
  bundleIdPrefix: app.acerciae
  deploymentTarget:
    iOS: "17.0"
packages:
  AcerciaeCore:
    path: AcerciaeCore
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  Acerciae:
    type: application
    platform: iOS
    sources:
      - App
      - path: ../contracts/openstudio/studio-engine.js
        buildPhase: resources
      - path: ../contracts/openstudio/studio-engine.html
        buildPhase: resources
      # The interactive message engine (HypertextEngine.swift) as a folder, so its page gets read access to it alone.
      - path: ../contracts/hypertext
        type: folder
        buildPhase: resources
      - path: ../contracts/fixtures/demo-campaign.json
        buildPhase: resources
    dependencies:
      - package: AcerciaeCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.acerciae.mobile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Acerciae
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      configs:
        Debug:
          INFOPLIST_FILE: Config/Debug-Info.plist
        Release:
          INFOPLIST_FILE: Config/Release-Info.plist
  AcerciaeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Acerciae
      - package: AcerciaeCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Acerciae:
    build:
      targets:
        Acerciae: all
    run:
      config: Debug
    test:
      targets: [AcerciaeTests]
